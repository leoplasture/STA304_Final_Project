codex:
  enabled: false
  binary: codex
  config_dir: ~/.codex
  profile: ''
  model: inherit
  model_reasoning_effort: xhigh
  approval_policy: never
  sandbox_mode: danger-full-access
  retry_on_failure: true
  retry_max_attempts: 7
  retry_initial_backoff_sec: 10.0
  retry_backoff_multiplier: 6.0
  retry_max_backoff_sec: 1800.0
  mcp_tool_timeout_sec: 172800
  env: {}
claude:
  enabled: true
  binary: claude
  config_dir: ~/.claude
  model: deepseek-chat
  permission_mode: bypassPermissions
  mcp_timeout_ms: 172800000
  mcp_tool_timeout_ms: 172800000
  retry_on_failure: true
  retry_max_attempts: 2
  retry_initial_backoff_sec: 10.0
  retry_backoff_multiplier: 4.0
  retry_max_backoff_sec: 600.0
  env: {}
  status: supported_experimental
kimi:
  enabled: false
  binary: kimi
  config_dir: ~/.kimi
  model: inherit
  agent: ''
  thinking: false
  yolo: true
  mcp_tool_timeout_ms: 172800000
  retry_on_failure: true
  retry_max_attempts: 4
  retry_initial_backoff_sec: 10.0
  retry_backoff_multiplier: 4.0
  retry_max_backoff_sec: 600.0
  env: {}
  status: supported_experimental
opencode:
  enabled: false
  binary: opencode
  config_dir: ~/.config/opencode
  model: inherit
  permission_mode: allow
  default_agent: ''
  variant: ''
  mcp_timeout_ms: 172800000
  retry_on_failure: true
  retry_max_attempts: 4
  retry_initial_backoff_sec: 10.0
  retry_backoff_multiplier: 4.0
  retry_max_backoff_sec: 600.0
  env: {}
  status: supported_experimental
